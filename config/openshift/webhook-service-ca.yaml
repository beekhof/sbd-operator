---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
  annotations:
    # Enable OpenShift service-ca to inject certificates automatically
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-certs
spec:
  ports:
    - name: webhook-server
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    # Enable OpenShift service-ca to inject CA bundle automatically
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-medik8s-medik8s-io-v1alpha1-sbdconfig
    # caBundle will be injected automatically by service-ca
  failurePolicy: Fail
  name: vsbdconfig.kb.io
  rules:
  - apiGroups:
    - medik8s.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - sbdconfigs
  sideEffects: None 