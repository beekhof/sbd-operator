apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set namespace for all resources
namespace: sbd-operator-system

resources:
# Include individual components but exclude webhook-related resources
- ../../config/crd
- rbac.yaml
- ../../config/manager
# NOTE: Deliberately NOT including webhook-service.yaml and webhook-config.yaml

patches:
- path: image-pull-policy-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
# NOTE: Deliberately NOT including webhook-patch.yaml
# Update manager deployment to use correct prefixed service account name
- path: manager-serviceaccount-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
# Disable webhooks via command line flag
- path: manager-disable-webhooks-patch.yaml
  target:
    kind: Deployment
    name: controller-manager 