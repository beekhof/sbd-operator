apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set namespace for all resources
namespace: sbd-operator-system

# Remove namePrefix since webhook config and service now use explicit full names
# This prevents double-prefixing while keeping RBAC names consistent

resources:
# Include individual components to avoid webhook conflicts with OpenShift service-ca
- ../../config/crd
# Use consolidated RBAC file to avoid kustomize security restrictions and double-prefixing
- rbac.yaml
- ../../config/manager
- webhook-service.yaml
# Add e2e-specific webhook configuration that doesn't conflict with service-ca
- webhook-config.yaml

patches:
- path: image-pull-policy-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
# Enable webhook patch for e2e tests - configures certificate mounting
- path: webhook-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
# Update manager deployment to use correct prefixed service account name
- path: manager-serviceaccount-patch.yaml
  target:
    kind: Deployment
    name: controller-manager

