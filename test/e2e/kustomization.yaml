apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set namespace for all resources
namespace: sbd-operator-system

resources:
# Use generic Kubernetes config instead of OpenShift to avoid service-ca conflicts with manual certificates
- ../../config/default

#images:
#- name: controller:latest
#  newName: quay.io/medik8s/sbd-operator
#  newTag: latest

patches:
- path: image-pull-policy-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
# Enable webhook patch for e2e tests - configures certificate mounting
- path: webhook-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
